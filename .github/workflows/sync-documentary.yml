name: Sync YouTube Documentary

on:
  workflow_dispatch:
  schedule:
    - cron: "37 7 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: youtube-documentary-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build UNCUT episode archive
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_PLAYLIST_ID: "PL_UEBZlt-mUL5Hc2zGP4_Xsr6ayZAtWs3"
        run: node scripts/sync-youtube.mjs

      - name: Open or update review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git diff --quiet -- data/documentary.json; then
            echo "No Documentary changes found."
            exit 0
          fi

          branch="automation/documentary-sync"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add data/documentary.json
          git commit -m "Synced YouTube Documentary"
          git push --force-with-lease origin "$branch"

          existing_pr="$(gh pr list --head "$branch" --base dev --state open --json number --jq '.[0].number')"
          if [ -z "$existing_pr" ]; then
            gh pr create \
              --base dev \
              --head "$branch" \
              --title "Sync YouTube Documentary" \
              --body "Automated review of the public UNCUT playlist. Merge after checking episode order, titles and Screening Room presentation."
          else
            echo "Updated pull request #$existing_pr."
          fi
