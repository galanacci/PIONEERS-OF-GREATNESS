name: Update site version
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: site-version-main
  cancel-in-progress: false
jobs:
  version:
    if: "!startsWith(github.event.head_commit.message, 'chore: update site version')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Count this push once and update the label
        env:
          PUSH_SHA: ${{ github.sha }}
        run: node scripts/update-site-version.mjs
      - name: Save version
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-version.json index.html
          git commit -m "chore: update site version"
          git push origin HEAD:main
