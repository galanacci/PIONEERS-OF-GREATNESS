<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="description" content="PIONEERS OF GREATNESS is Humanwear shaped by boxing culture—built on discipline, resilience and the pursuit of greatness.">
    <title>PIONEERS OF GREATNESS</title>
    <link rel="icon" type="image/png" href="src/POG_FAVICON.png">
    <meta property="og:title" content="PIONEERS OF GREATNESS">
    <meta property="og:description" content="Humanwear shaped by boxing culture—built on discipline, resilience and the pursuit of greatness.">
    <meta property="og:url" content="https://pioneersofgreatness.com/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="PIONEERS OF GREATNESS">
    <meta property="og:locale" content="en_GB">
    <meta property="og:image" content="https://pioneersofgreatness.com/src/POG_SOCIAL_PREVIEW.jpg">
    <meta property="og:image:secure_url" content="https://pioneersofgreatness.com/src/POG_SOCIAL_PREVIEW.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="PIONEERS OF GREATNESS — This ripple will be a tsunami">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="PIONEERS OF GREATNESS">
    <meta name="twitter:description" content="Humanwear shaped by boxing culture—built on discipline, resilience and the pursuit of greatness.">
    <meta name="twitter:image" content="https://pioneersofgreatness.com/src/POG_SOCIAL_PREVIEW.jpg">
    <meta name="twitter:image:alt" content="PIONEERS OF GREATNESS — This ripple will be a tsunami">
    <meta name="theme-color" content="#000000">
    <link rel="canonical" href="https://pioneersofgreatness.com/">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="logo-container">
    <a href="https://www.instagram.com/pioneersofgreatness/" target="_blank" rel="noopener noreferrer" class="logo-wrapper">
        <img src="src/POG_FULL_LOGO_WHITE.png" alt="GALANACCI POG FULL LOGO" class="logo logo-1">
    </a>
</div>
    </nav>

    <div id="container">
        <video autoplay muted loop playsinline class="background-video">
            <source src="src/BACKGROUND_VIDEO1.mp4" type="video/mp4">
        </video>
        <audio id="site-ambience" preload="none" loop>
            <source src="src/audio/muhammad-ali-training-normalized.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div class="container">
        <form id="email-form">
            <div class="input-container">
                <input type="email" id="email" name="email" autocomplete="email" aria-label="Email address" placeholder="ENTER EMAIL HERE..." required>
                <div id="animated-placeholder" aria-hidden="true"></div>
            </div>
            <button type="submit" aria-label="Join the waitlist"><span class="button-text">➔</span><span class="button-arrow">➔</span></button>
            <button type="button" class="menu-toggle" aria-label="Begin experience" aria-controls="menu-overlay" aria-expanded="false">
                <span class="menu-toggle-label">BEGIN</span>
            </button>
        </form>
        <div id="status" role="status" aria-live="polite"></div>
    </div>

    <div id="menu-overlay" class="menu-overlay" aria-hidden="true">
        <div class="menu-panel" role="dialog" aria-modal="true" aria-label="PIONEERS OF GREATNESS menu" tabindex="-1">
            <ul class="menu-list" role="menu">
                <li><button type="button" class="menu-item is-selected" role="menuitem" data-menu-action="waitlist">JOIN WAITLIST</button></li>
                <li><button type="button" class="menu-item" role="menuitem" data-menu-action="founder">FOUNDER</button></li>
                <li><button type="button" class="menu-item" role="menuitem" data-menu-action="room" data-room-target="documentary-room">VIDEO JOURNAL</button></li>
                <li><button type="button" class="menu-item" role="menuitem" data-menu-action="room" data-room-target="field-notes-room">BEHIND THE SCENES</button></li>
                <li><button type="button" class="menu-item" role="menuitem" data-menu-action="placeholder" aria-disabled="true">COLLECTIONS</button></li>
                <li><button type="button" class="menu-item" role="menuitem" data-menu-action="exit">EXIT</button></li>
            </ul>
            <div class="menu-waitlist" aria-label="Join the waitlist" hidden></div>
            <p class="menu-version">VERSION_026</p>
            <div class="menu-audio">
            <span class="audio-track"><span aria-hidden="true">♪</span> MUHAMMAD ALI TRAINING</span>
            <button type="button" class="audio-toggle" aria-label="Turn training ambience on" aria-pressed="false">
                <span class="audio-dot" aria-hidden="true"></span>
                <span class="audio-label">SOUND OFF</span>
            </button>
            </div>
        </div>
    </div>

    <section id="founder-introduction" class="founder-introduction" aria-hidden="true" aria-labelledby="founder-introduction-title">
        <div class="founder-introduction-inner">
            <h1 id="founder-introduction-title" class="visually-hidden">GREATNESS POEM</h1>
            <div id="founder-introduction-copy" class="founder-introduction-copy" aria-live="polite"></div>
            <figure id="founder-poem-reveal" class="founder-poem-reveal" hidden>
                <img src="src/founder/greatness-tee.webp" width="1200" height="1600" alt="GALANACCI holding the first PIONEERS OF GREATNESS product, the GREATNESS tee">
            </figure>
            <div id="founder-introduction-actions" class="founder-introduction-actions" hidden>
                <button type="button" data-opening-replay>
                    <svg class="founder-replay-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M4 11a8 8 0 1 1 2.34 5.66M4 11V5m0 6h6" />
                    </svg>
                    <span>REPLAY POEM</span>
                </button>
                <button type="button" data-opening-enter>ENTER MENU</button>
            </div>
            <button type="button" id="founder-introduction-skip" class="founder-introduction-skip" hidden>SKIP</button>
            <button type="button" id="founder-introduction-enter" class="founder-introduction-enter" hidden>ENTER</button>
        </div>
    </section>

    <section id="founder-room" class="world-room founder-room" aria-hidden="true" aria-labelledby="founder-title">
        <div class="world-room-content founder-content">
            <button type="button" class="room-return" data-room-close>&larr; RETURN TO MENU</button>

            <section id="founder-hub" class="founder-hub" aria-labelledby="founder-title">
                <header class="founder-hub-header">
                    <p class="room-kicker">GALANACCI THE CREATOR</p>
                    <h1 id="founder-title">FOUNDER</h1>
                </header>
                <div id="founder-hub-list" class="founder-hub-list" role="menu" aria-label="Founder story chapters"></div>
                <p id="founder-hub-status" class="founder-hub-status" role="status" aria-live="polite">SELECT A CHAPTER</p>
                <p class="founder-hub-instructions">UP / DOWN — MOVE&nbsp;&nbsp;&nbsp; ENTER — SELECT</p>
            </section>
            <section id="founder-experience" class="founder-experience" aria-live="polite" hidden></section>

        </div>
    </section>

    <section id="documentary-room" class="world-room documentary-room" aria-hidden="true" aria-labelledby="documentary-title">
        <div class="world-room-content documentary-content">
            <button type="button" class="room-return" data-room-close>&larr; RETURN TO MENU</button>
            <header class="documentary-header">
                <p class="room-kicker">VIDEO JOURNAL</p>
                <h1 id="documentary-title">UNCUT</h1>
            </header>
            <div id="documentary-feature" class="documentary-feature" aria-live="polite"></div>
            <div id="documentary-archive-heading" class="documentary-archive-heading">
                <p class="room-season">EPISODE ARCHIVE</p>
            </div>
            <div id="documentary-list" class="documentary-archive" aria-label="UNCUT episodes"></div>
            <a class="room-watch" href="https://www.youtube.com/playlist?list=PL_UEBZlt-mUL5Hc2zGP4_Xsr6ayZAtWs3" target="_blank" rel="noopener noreferrer">WATCH ON YOUTUBE</a>
        </div>
    </section>

    <section id="field-notes-room" class="world-room field-notes-room" aria-hidden="true" aria-labelledby="field-notes-title">
        <div class="world-room-content field-notes-content">
            <button type="button" class="room-return" data-room-close>&larr; RETURN TO MENU</button>
            <header class="field-notes-header">
                <p class="room-kicker">JOURNAL ROOM</p>
                <h1 id="field-notes-title">BEHIND THE SCENES</h1>
            </header>
            <div class="room-divider" aria-hidden="true"></div>
            <div id="field-notes-list" class="field-notes-list" aria-live="polite"></div>
        </div>
    </section>

    <div id="room-transition" class="room-transition" aria-hidden="true">
        <img id="room-transition-art" src="src/ui/loader-a7f3.webp" width="560" height="533" alt="" aria-hidden="true" draggable="false">
        <span class="room-transition-label" role="status" aria-live="polite">LOADING</span>
    </div>

    <div class="copyright">
        © 2026 A GALANACCI® COMPANY
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
