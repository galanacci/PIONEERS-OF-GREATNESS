<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PIONEERS OF GREATNESS is a Humanwear brand, bridging boxing and fashion. Designed for those who dare to be great.">
    <title>PIONEERS OF GREATNESS</title>
    <link rel="icon" type="image/png" href="src/POG_FAVICON.png">
    <meta property="og:title" content="GALANACCI® PIONEERS OF GREATNESS">
    <meta property="og:description" content="GALANACCI® PIONEERS OF GREATNESS is a Humanwear brand, bridging boxing and fashion. Designed for those who dare to be great.">
    <meta property="og:url" content="pioneersofgreatness.com">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/png" href="src/POG_FAVICON.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="logo-container">
    <a href="https://www.instagram.com/pioneersofgreatness/" target="_blank" rel="noopener noreferrer" class="logo-wrapper">
        <img src="src/POG_FULL_LOGO_WHITE.png" alt="GALANACCI POG FULL LOGO" class="logo logo-1">
    </a>
</div>
    </nav>

    <button type="button" class="audio-toggle" aria-label="Turn background audio on" aria-pressed="false">
        <span class="audio-dot" aria-hidden="true"></span>
        <span class="audio-label">SOUND OFF</span>
    </button>

    <div id="container">
        <video autoplay muted loop playsinline class="background-video">
            <source src="src/BACKGROUND_VIDEO1.mp4" type="video/mp4">
        </video>
    </div>

    <div class="container">
        <form id="email-form">
            <div class="input-container">
                <input type="email" id="email" name="email" autocomplete="email" aria-label="Email address" required>
                <div id="animated-placeholder"></div>
            </div>
            <button type="submit" aria-label="Join the waitlist"><span class="button-text">➔</span><span class="button-arrow">➔</span></button>
            <button type="button" class="menu-toggle" aria-label="Open menu" aria-controls="menu-overlay" aria-expanded="false">
                <span class="menu-line"></span>
                <span class="menu-line"></span>
                <span class="menu-line"></span>
            </button>
        </form>
        <div id="status" role="status" aria-live="polite"></div>
    </div>

    <div id="menu-overlay" class="menu-overlay" aria-hidden="true">
        <div class="menu-panel" role="dialog" aria-modal="true" aria-label="PIONEERS OF GREATNESS menu" tabindex="-1">
            <ul class="menu-list" role="menu">
                <li><button type="button" class="menu-item is-selected" role="menuitem" data-menu-action="waitlist">WAITLIST</button></li>
                <li><button type="button" class="menu-item" role="menuitem" data-menu-action="placeholder" aria-disabled="true">FOUNDER</button></li>
                <li><button type="button" class="menu-item" role="menuitem" data-menu-action="external" data-menu-url="https://www.youtube.com/playlist?list=PL_UEBZlt-mUL5Hc2zGP4_Xsr6ayZAtWs3">DOCUMENTARY</button></li>
                <li><button type="button" class="menu-item" role="menuitem" data-menu-action="external" data-menu-url="https://www.instagram.com/galanacci">FIELD NOTES</button></li>
                <li><button type="button" class="menu-item" role="menuitem" data-menu-action="placeholder" aria-disabled="true">ARCHIVE</button></li>
                <li><button type="button" class="menu-item" role="menuitem" data-menu-action="exit">EXIT</button></li>
            </ul>
        </div>
    </div>

    <div class="copyright">
        © 2026 A GALANACCI® COMPANY
    </div>

    <script src="script.js"></script>
</body>
</html>
